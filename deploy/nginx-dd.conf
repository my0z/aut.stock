# 데이 단타 대시보드 dd.usb.kr  /etc/nginx/sites-available/dd -> sites-enabled 에 링크
# DNS: A 레코드 dd -> VM 공인 IP (ab.usb.kr 과 같은 주소). https 는 certbot --nginx -d dd.usb.kr
server {
    listen 80;
    server_name dd.usb.kr;
    root /home/ubuntu/aut.stock/daytrade/web;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    add_header Cache-Control "no-store";
}
