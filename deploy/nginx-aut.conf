# /etc/nginx/sites-available/aut  -> sites-enabled 에 링크
# 호스트 이름은 본인 도메인으로 바꾼다. https 는 certbot --nginx -d ab.usb.kr 로 붙인다.
server {
    listen 80;
    server_name ab.usb.kr;
    root /home/ubuntu/aut.stock/dashboard;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    add_header Cache-Control "no-store";
}
