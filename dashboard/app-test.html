<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>영웅문 연결 테스트</title>
<style>
:root{--bg:#fff;--fg:#111;--muted:#777;--line:#e5e5e5;--card:#f6f6f6;--ok:#1a7f37}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--fg:#eee;--muted:#999;--line:#333;--card:#1e1e1e;--ok:#4ac26b}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,system-ui,"Apple SD Gothic Neo",sans-serif}
.row{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row code{flex:1;font-size:14px}
button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.muted{color:var(--muted)}.ok{color:var(--ok);font-weight:600}
</style></head><body>
<h1 style="font-size:20px">영웅문S# 연결 테스트</h1>
<p class="muted">후보마다 "열기"를 눌러 보세요. 영웅문S#이 열리면 이 페이지로 돌아와서 그 줄의 "저장"을 누르세요. 안 열리면 이 페이지가 다시 뜹니다.</p>
<p>현재 저장값: <span id="cur" class="ok"></span></p>
<div id="list"></div>
<p><button id="clear">저장값 지우기</button> <a href="./">대시보드로</a></p>
<script>
const PKG = "com.kiwoom.heromts";
const CANDIDATES = ["heromts", "kiwoomheromts", "kiwoom", "kiwoomhero", "herosharp", "heros", "kiwoomsharp",
  "kiwoommts", "heromtsapp", "kiwoomapp", "kiwoomsec", "hero", "kiwoomherosharp", "com.kiwoom.heromts"];
function get() { try { return localStorage.getItem("heroScheme") || ""; } catch (_) { return ""; } }
function show() { document.getElementById("cur").textContent = get() || "없음"; }
const back = encodeURIComponent(location.href.split("#")[0]);
const list = document.getElementById("list");
for (const s of CANDIDATES) {
  const row = document.createElement("div"); row.className = "row";
  row.innerHTML = `<code></code><button data-a="open">열기</button><button data-a="save">저장</button>`;
  row.querySelector("code").textContent = s;
  row.querySelector("[data-a=open]").onclick = () => {
    location.href = `intent://#Intent;scheme=${s};package=${PKG};S.browser_fallback_url=${back};end`;
  };
  row.querySelector("[data-a=save]").onclick = () => { try { localStorage.setItem("heroScheme", s); } catch (_) {} show(); };
  list.appendChild(row);
}
document.getElementById("clear").onclick = () => { try { localStorage.removeItem("heroScheme"); } catch (_) {} show(); };
show();
</script>
</body></html>
